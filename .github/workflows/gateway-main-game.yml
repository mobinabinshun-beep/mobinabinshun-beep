name: N.U Gateway main-game regression

on:
  pull_request:
    paths:
      - "index.html"
      - "nu-hex-gateway.js"
      - "nu-controller-pointer.js"
      - "nu-hex-gateway.css"
      - "nu-games.js"
      - "nu-gateway-pause.js"
      - "tests/nu-gateway-pause.test.js"
      - "tests/nu-gateway-exclusive-controls.test.js"
      - "tests/nu-gateway-controller-input.test.js"
      - "nu-dynamic-layers.js"
      - "tests/nu-hex-gateway.test.js"
      - ".github/workflows/gateway-main-game.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Gateway and renderer lifecycle syntax
        run: |
          node --check nu-hex-gateway.js
          node --check nu-controller-pointer.js
          node --check nu-games.js
          node --check nu-gateway-pause.js
          node --check nu-dynamic-layers.js
      - name: Run Gateway main-game regression tests
        run: node --test tests/nu-hex-gateway.test.js tests/nu-gateway-pause.test.js tests/nu-gateway-exclusive-controls.test.js tests/nu-gateway-controller-input.test.js
