name: Pixel Art Studio live demo QA verification
on:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
permissions:
  contents: read
concurrency:
  group: pixel-art-studio-live-qa
  cancel-in-progress: false
jobs:
  live-demo-smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify the deployed Library and Studio pages
        run: |
          echo "Pages source SHA: ${{ github.event.workflow_run.head_sha }}"
          python tests/nu-studio-browser-smoke.py --base-url https://mobinabinshun-beep.github.io/mobinabinshun-beep --browser chromium --require-mix --live
