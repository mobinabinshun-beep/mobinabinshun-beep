name: N.U graphics integrity
on:
  push:
    paths:
      - "index.html"
      - "nu-background-engine.js"
      - "nu-graphics-runtime.js"
      - "nu-world.css"
      - "assets/backgrounds/**"
      - "assets/nu-celestial-city.png"
      - "archive/visual-layers/**"
      - ".github/workflows/graphics-ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "nu-background-engine.js"
      - "nu-graphics-runtime.js"
      - "nu-world.css"
      - "assets/backgrounds/**"
      - "assets/nu-celestial-city.png"
      - "archive/visual-layers/**"
      - ".github/workflows/graphics-ci.yml"
  workflow_dispatch:
jobs:
  graphics-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical background asset and runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const ASSET="./assets/nu-celestial-city.png"' nu-background-engine.js
          if [ -f assets/nu-celestial-city.png ]; then test -s assets/nu-celestial-city.png; else echo "Canonical PNG not yet transferred; procedural fallback must remain available."; fi
          grep -Fq 'id="nu-background-image"' nu-background-engine.js
          grep -Fq 'z-index:0;overflow:hidden' nu-background-engine.js
          grep -Fq 'world.insertBefore(node,world.firstChild)' nu-background-engine.js
          grep -Fq 'world>.sky{position:absolute;z-index:1!important' nu-world.css
          grep -Fq 'nu-pixel-world.js' index.html
          grep -Fq 'nu-background-engine.js' index.html
          grep -Fq 'visualOverlays:status.loaded?"image-first":"procedural-fallback"' nu-graphics-runtime.js
          grep -Fq 'NUPixelWorld&&g.NUPixelWorld.setEnabled&&g.NUPixelWorld.setEnabled(true)' nu-graphics-runtime.js
          test -s archive/visual-layers/nu-pixel-world.js
          test -s archive/visual-layers/nu-dynamic-layers.js
      - name: Check runtime JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in nu-background-engine.js nu-graphics-runtime.js nu-graphics-core.js nu-dynamic-layers.js nu-game-render-adapter.js; do
            node --check "$file"
          done
