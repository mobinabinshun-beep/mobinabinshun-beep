name: N.U graphics integrity
on:
  push:
    paths:
      - "index.html"
      - "nu-background-engine.js"
      - "nu-graphics-runtime.js"
      - "nu-adaptive-governor.js"
      - "nu-games.js"
      - "nu-launcher.js"
      - "nu-game-render-adapter.js"
      - "nu-world.css"
      - "nu-hex-gateway.css"
      - "tests/nu-layer-contract.test.js"
      - "tests/nu-background-engine.test.js"
      - "tests/nu-adaptive-governor.test.js"
      - "tests/nu-hex-gateway.test.js"
      - "docs/architecture/NU-UI-LAYER-AND-EXTENSION-ISOLATION-PROTOCOL.md"
      - "assets/backgrounds/**"
      - "assets/nu-celestial-city.png"
      - "archive/visual-layers/**"
      - ".github/workflows/graphics-ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "nu-background-engine.js"
      - "nu-graphics-runtime.js"
      - "nu-adaptive-governor.js"
      - "nu-games.js"
      - "nu-launcher.js"
      - "nu-game-render-adapter.js"
      - "nu-world.css"
      - "nu-hex-gateway.css"
      - "tests/nu-layer-contract.test.js"
      - "tests/nu-background-engine.test.js"
      - "tests/nu-adaptive-governor.test.js"
      - "tests/nu-hex-gateway.test.js"
      - "docs/architecture/NU-UI-LAYER-AND-EXTENSION-ISOLATION-PROTOCOL.md"
      - "assets/backgrounds/**"
      - "assets/nu-celestial-city.png"
      - "archive/visual-layers/**"
      - ".github/workflows/graphics-ci.yml"
  workflow_dispatch:
jobs:
  graphics-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical background asset and runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const ASSET="./assets/nu-celestial-city.png"' nu-background-engine.js
          if [ -f assets/nu-celestial-city.png ]; then test -s assets/nu-celestial-city.png; else echo "Canonical PNG missing; active page must use neutral solid fallback and must not start procedural renderers."; fi
          grep -Fq 'id="nu-background-image"' nu-background-engine.js
          grep -Fq 'z-index:var(--nu-layer-world-background,0);overflow:hidden' nu-background-engine.js
          grep -Fq 'world.insertBefore(node,world.firstChild)' nu-background-engine.js
          grep -Fq 'nu-background-engine.js' index.html
          grep -Fq 'nu-adaptive-governor.js' index.html
          ! grep -Fq 'nu-dynamic-layers.js' index.html
          ! grep -Fq 'nu-pixel-world.js' index.html
          ! grep -Fq 'id="pixel-world"' index.html
          ! grep -Fq 'id="world-canvas"' index.html
          ! grep -Fq 'class="sky"' index.html
          ! grep -Fq 'class="horizon"' index.html
          grep -Fq 'imageOnly: true' nu-graphics-runtime.js
          grep -Fq 'visualOverlays: "none"' nu-graphics-runtime.js
          grep -Fq 'fallback: status.loaded ? null : "solid-color"' nu-graphics-runtime.js
          grep -Fq 'nu:graphics-adjusted' nu-games.js
          grep -Fq 'state.quality=' nu-games.js
          test -s archive/visual-layers/nu-pixel-world.js
          test -s archive/visual-layers/nu-dynamic-layers.js
      - name: Check runtime JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in nu-background-engine.js nu-graphics-runtime.js nu-graphics-core.js nu-adaptive-governor.js nu-game-render-adapter.js nu-games.js nu-launcher.js; do
            node --check "$file"
          done
      - name: Enforce UI layer and foreground safety contract
        run: node --test tests/nu-background-engine.test.js tests/nu-layer-contract.test.js tests/nu-adaptive-governor.test.js tests/nu-hex-gateway.test.js
