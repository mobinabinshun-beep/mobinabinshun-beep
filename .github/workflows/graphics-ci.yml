name: N.U graphics integrity
on:
  push:
    paths:
      - "index.html"
      - "nu-background-engine.js"
      - "nu-graphics-runtime.js"
      - "nu-world.css"
      - "nu-hex-gateway.css"
      - "tests/nu-layer-contract.test.js"
      - "tests/nu-background-engine.test.js"
      - "docs/architecture/NU-UI-LAYER-AND-EXTENSION-ISOLATION-PROTOCOL.md"
      - "assets/backgrounds/**"
      - "assets/nu-celestial-city.png"
      - "archive/visual-layers/**"
      - ".github/workflows/graphics-ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "nu-background-engine.js"
      - "nu-graphics-runtime.js"
      - "nu-world.css"
      - "nu-hex-gateway.css"
      - "tests/nu-layer-contract.test.js"
      - "tests/nu-background-engine.test.js"
      - "docs/architecture/NU-UI-LAYER-AND-EXTENSION-ISOLATION-PROTOCOL.md"
      - "assets/backgrounds/**"
      - "assets/nu-celestial-city.png"
      - "archive/visual-layers/**"
      - ".github/workflows/graphics-ci.yml"
  workflow_dispatch:
jobs:
  graphics-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical background asset and runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const ASSET="./assets/nu-celestial-city.png"' nu-background-engine.js
          test -s assets/nu-celestial-city.png
          test "$(git rev-parse HEAD:assets/nu-celestial-city.png)" = "$(git rev-parse HEAD:assets/Original\ reference\ image\ file\ for\ Niroo\ Universe\ \(N.U\).png)"
          echo "901b19a90892ecc7e5185891a7d1a1e822299188043d2220650c2bd7e176ea52  assets/nu-celestial-city.png" | sha256sum -c -
          grep -Fq 'id="nu-background-image"' nu-background-engine.js
          grep -Fq 'z-index:var(--nu-layer-world-background,0);overflow:hidden' nu-background-engine.js
          grep -Fq 'world.insertBefore(node,world.firstChild)' nu-background-engine.js
          grep -Fq 'world>.sky{position:absolute;z-index:var(--nu-layer-world-atmosphere,1)!important' nu-world.css
          grep -Fq 'nu-pixel-world.js' index.html
          grep -Fq 'nu-background-engine.js' index.html
          grep -Fq 'visualOverlays:status.loaded?"image-first":"procedural-fallback"' nu-graphics-runtime.js
          grep -Fq 'NUPixelWorld&&g.NUPixelWorld.setEnabled&&g.NUPixelWorld.setEnabled(true)' nu-graphics-runtime.js
          test -s archive/visual-layers/nu-pixel-world.js
          test -s archive/visual-layers/nu-dynamic-layers.js
      - name: Check runtime JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in nu-background-engine.js nu-graphics-runtime.js nu-graphics-core.js nu-dynamic-layers.js nu-game-render-adapter.js; do
            node --check "$file"
          done
      - name: Enforce UI layer and foreground safety contract
        run: node --test tests/nu-background-engine.test.js tests/nu-layer-contract.test.js
