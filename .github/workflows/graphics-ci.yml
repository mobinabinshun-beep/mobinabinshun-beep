name: N.U graphics integrity
on:
  push:
    paths:
      - "index.html"
      - "nu-background-engine.js"
      - "nu-graphics-runtime.js"
      - "nu-world.css"
      - "nu-hex-gateway.css"
      - "tests/nu-layer-contract.test.js"
      - "tests/nu-background-engine.test.js"
      - "docs/architecture/NU-UI-LAYER-AND-EXTENSION-ISOLATION-PROTOCOL.md"
      - "assets/backgrounds/**"
      - "archive/visual-layers/**"
      - ".github/workflows/graphics-ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "nu-background-engine.js"
      - "nu-graphics-runtime.js"
      - "nu-world.css"
      - "nu-hex-gateway.css"
      - "tests/nu-layer-contract.test.js"
      - "tests/nu-background-engine.test.js"
      - "docs/architecture/NU-UI-LAYER-AND-EXTENSION-ISOLATION-PROTOCOL.md"
      - "assets/backgrounds/**"
      - "archive/visual-layers/**"
      - ".github/workflows/graphics-ci.yml"
  workflow_dispatch:
jobs:
  graphics-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical single-image background and runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/backgrounds/niroo-universe-background.svg
          grep -Fq 'const ASSET="./assets/backgrounds/niroo-universe-background.svg"' nu-background-engine.js
          grep -Fq 'object-fit:contain' nu-background-engine.js
          grep -Fq 'world.insertBefore(node,world.firstChild)' nu-background-engine.js
          grep -Fq 'nu-background-engine.js' index.html
          ! grep -Fq 'nu-dynamic-layers.js' index.html
          ! grep -Fq 'nu-pixel-world.js' index.html
          ! grep -Fq 'NUDynamicLayers' nu-graphics-runtime.js
          ! grep -Fq 'NUPixelWorld' nu-graphics-runtime.js
          grep -Fq 'visualOverlays:"none"' nu-graphics-runtime.js
          grep -Fq 'backgroundLayers:0' nu-graphics-runtime.js
          grep -Fq 'N.U XP-FIRST STATIC IMAGE OVERRIDE' nu-world.css
          test -s archive/visual-layers/nu-pixel-world.js
          test -s archive/visual-layers/nu-dynamic-layers.js
      - name: Check runtime JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in nu-background-engine.js nu-graphics-runtime.js nu-graphics-core.js nu-game-render-adapter.js; do
            node --check "$file"
          done
      - name: Enforce UI layer and foreground safety contract
        run: node --test tests/nu-background-engine.test.js tests/nu-layer-contract.test.js
