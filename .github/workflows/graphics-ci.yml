name: N.U graphics integrity
on:
  push:
    paths:
      - "index.html"
      - "nu-background-engine.js"
      - "nu-graphics-runtime.js"
      - "nu-world.css"
      - "background-candidates.html"
      - "assets/backgrounds/**"
      - "archive/visual-layers/**"
      - ".github/workflows/graphics-ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "nu-background-engine.js"
      - "nu-graphics-runtime.js"
      - "nu-world.css"
      - "background-candidates.html"
      - "assets/backgrounds/**"
      - "archive/visual-layers/**"
      - ".github/workflows/graphics-ci.yml"
  workflow_dispatch:
jobs:
  graphics-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical scene wiring and quarantine
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'assets/backgrounds/niroo-universe-background.svg' nu-background-engine.js
          test -s assets/backgrounds/niroo-universe-background.svg
          grep -Fq 'const ASSET="./assets/backgrounds/niroo-universe-background.svg"' nu-background-engine.js
          grep -Fq 'id="nu-background-image"' nu-background-engine.js
          grep -Fq 'z-index:-3' nu-background-engine.js
          ! grep -Fq 'nu-pixel-world.js' index.html
          grep -Fq 'nu-dynamic-layers' nu-world.css
          grep -Fq 'display:none!important' nu-world.css
          test -s archive/visual-layers/nu-pixel-world.js
          test -s archive/visual-layers/nu-dynamic-layers.js
          grep -Fq 'visualOverlays:"quarantined"' nu-graphics-runtime.js
      - name: Verify unified background candidate lab
        shell: bash
        run: |
          set -euo pipefail
          test -s background-candidates.html
          grep -Fq 'data-pick="svg"' background-candidates.html
          grep -Fq 'data-pick="png"' background-candidates.html
          grep -Fq 'data-pick="gen1"' background-candidates.html
          grep -Fq 'data-pick="gen2"' background-candidates.html
          grep -Fq 'data-pick="css"' background-candidates.html
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('background-candidates.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x => x[1]);
          if (scripts.length !== 3) throw new Error('Expected 3 preview scripts');
          scripts.forEach((source, i) => { new Function(source); console.log('script', i + 1, 'syntax OK'); });
          const m = scripts[0].match(/const SVG_SOURCE=("(?:\\.|[^"\\])*");/);
          if (!m) throw new Error('Embedded canonical SVG source missing');
          const svg = JSON.parse(m[1]);
          if (!/<svg\b/.test(svg) || !/data:image\/png;base64,/.test(svg)) throw new Error('Canonical SVG wrapper invalid');
          console.log('embedded SVG source OK');
          NODE
