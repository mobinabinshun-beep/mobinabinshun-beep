name: N.U Arcane Shield and Mana regression
on:
  pull_request:
    paths:
      - "nu-wallet.js"
      - "nu-games.js"
      - "index.html"
      - "nu-arcane-shield.css"
      - "tests/nu-arcane-shield.test.js"
      - ".github/workflows/arcane-shield-regression.yml"
      - "tests/*.test.js"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arcane-shield-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check nu-wallet.js
          node --check nu-games.js
      - name: Run focused and adjacent Generation 1 regression tests
        run: |
          node --test tests/nu-arcane-shield.test.js tests/nu-wallet.test.js tests/nu-keyboard-gameplay.test.js tests/nu-health.test.js tests/nu-hp-pill-interaction.test.js tests/nu-wallet-history-presentation.test.js tests/nu-hud-layout.test.js
      - name: Run complete Generation 1 test suite
        run: node --test tests/*.test.js
