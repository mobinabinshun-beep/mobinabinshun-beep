name: N.U Live-Pack pre-transfer machine gate

on:
  pull_request:
    branches:
      - "Official-public-information-and-discovery-hub-for-N.U-(Niroo-Universe),-its-publishing-network,-projects,-publications-and-related-creative-works"
  push:
    branches:
      - "Official-public-information-and-discovery-hub-for-N.U-(Niroo-Universe),-its-publishing-network,-projects,-publications-and-related-creative-works"
      - "fix/live-pack-machine-ready-2026-11-26"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nu-live-pack-pretransfer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-tests:
    name: Runtime integrity and complete regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every root JavaScript module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)
      - name: Validate project and package manifests
        run: |
          python -m json.tool NU-GENERATION-1-MANIFEST.json >/dev/null
          python -m json.tool build-info.json >/dev/null
          test -s health.txt
          grep -Fxq 'status=ok' health.txt
          python - <<'PY'
          import json
          m=json.load(open("NU-GENERATION-1-MANIFEST.json",encoding="utf-8"))
          g=m["graphicsRuntime"]
          assert g["publicAssetStatus"] == "PRESENT_IN_SOURCE_AND_CANDIDATE; SHA-256 VERIFIED"
          assert g["assetSha256"] == "901b19a90892ecc7e5185891a7d1a1e822299188043d2220650c2bd7e176ea52"
          assert m["healthProbe"]["file"] == "health.txt"
          PY
      - name: Verify canonical scene asset byte identity
        run: |
          set -euo pipefail
          test -s assets/nu-celestial-city.png
          test "$(git rev-parse HEAD:assets/nu-celestial-city.png)" = "$(git rev-parse HEAD:assets/Original\ reference\ image\ file\ for\ Niroo\ Universe\ \(N.U\).png)"
          echo "901b19a90892ecc7e5185891a7d1a1e822299188043d2220650c2bd7e176ea52  assets/nu-celestial-city.png" | sha256sum -c -
          grep -Fq 'const ASSET="./assets/nu-celestial-city.png"' nu-background-engine.js
      - name: Verify public UI has no internal QA banners or issue-report controls
        run: |
          ! grep -Eq 'PUBLIC TEST BUILD|REPORT STUDIO TEST|DOWNLOAD HUMAN TEST REPORT' index.html launcher.html
          grep -Fq 'TEST CANDIDATE — NOT HUMAN-APPROVED' index.html
          grep -Fq 'TEST CANDIDATE — NOT HUMAN-APPROVED' pixel-art-studio.html
          grep -Fq './build-info.json' index.html
          ! grep -Fq 'REPORT STUDIO TEST' pixel-art-studio.html
      - name: Verify same-origin health probe wiring
        run: |
          grep -Fq './health.txt?nu_probe=' nu-engine.js
          grep -Fq './health.txt?calibration=' nu-launcher.js
      - name: Verify dependency closure, health probes, and service-worker scope
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re
          root=Path(".")
          pages=["index.html","launcher.html","pixel-art-studio.html","casino.html","exchange.html","sim-pixel-demo.html","404.html"]
          missing=set()
          checked=0
          file_ext=re.compile(r"\.(?:html|js|css|svg|png|jpe?g|webp|json|txt|xml|ico|woff2?)(?:$|[?#])",re.I)
          def check(raw,origin):
              global checked
              raw=raw.strip().strip('"').strip("'")
              if not raw or raw.startswith(("#","http:","https:","//","data:","blob:","mailto:","tel:","javascript:")):
                  return
              raw=raw.split("#",1)[0].split("?",1)[0]
              if raw.startswith("./"): raw=raw[2:]
              elif raw.startswith("../"): raw=str((Path(origin).parent/ raw).as_posix())
              raw=unquote(raw)
              if not raw:
                  return
              if not raw.startswith("/") and not file_ext.search(raw):
                  return
              raw=raw.lstrip("/")
              p=root/raw
              if raw.endswith("/"):
                  if not p.is_dir(): missing.add(f"{origin}: {raw}")
              elif not p.is_file():
                  missing.add(f"{origin}: {raw}")
              checked+=1
          attr=re.compile(r"""\b(?:src|href|poster|data|action)=["']([^"']+)["']""",re.I)
          css_url=re.compile(r"""url\(\s*["']?([^)"']+)["']?\s*\)""",re.I)
          for page in pages:
              html=(root/page).read_text(encoding="utf-8")
              for value in attr.findall(html): check(value,page)
              for value in css_url.findall(html): check(value,page)
          for p in sorted(root.glob("*.css")):
              for value in css_url.findall(p.read_text(encoding="utf-8")): check(value,p.name)
          for p in sorted(root.rglob("*.svg")):
              svg=p.read_text(encoding="utf-8")
              for value in re.findall(r"""(?:href|xlink:href)=["']([^"']+)["']""",svg,re.I): check(value,p.name)
          for p in sorted(root.glob("*.js")):
              js=p.read_text(encoding="utf-8")
              for value in re.findall(r"""["'](\.{1,2}/[^"']+)["']""",js): check(value,p.name)
          sw=(root/"nu-exchange-sw.js").read_text(encoding="utf-8")
          assets=re.search(r"""const APP_ASSETS=\[(.*?)\];""",sw,re.S)
          assert assets, "service-worker APP_ASSETS list missing"
          for value in re.findall(r"""["']([^"']+)["']""",assets.group(1)): check(value,"nu-exchange-sw.js")
          exchange=(root/"exchange.html").read_text(encoding="utf-8")
          assert 'navigator.serviceWorker.register("./nu-exchange-sw.js")' in exchange
          assert "new URL(path,self.registration.scope)" in sw
          assert './health.txt?nu_probe=' in (root/"nu-engine.js").read_text(encoding="utf-8")
          assert './health.txt?calibration=' in (root/"nu-launcher.js").read_text(encoding="utf-8")
          assert './build-info.json' in (root/"index.html").read_text(encoding="utf-8")
          assert (root/"health.txt").is_file() and "status=ok" in (root/"health.txt").read_text(encoding="utf-8")
          assert (root/"build-info.json").is_file()
          assert "README.md?nu_probe=" not in (root/"nu-engine.js").read_text(encoding="utf-8")
          assert "README.md?calibration=" not in (root/"nu-launcher.js").read_text(encoding="utf-8")
          assert "downloadHumanReport" not in (root/"nu-player-ui.js").read_text(encoding="utf-8")
          assert "wallet-human-report" not in (root/"index.html").read_text(encoding="utf-8")
          assert "exportReport" not in (root/"nu-launcher.js").read_text(encoding="utf-8")
          assert "export-report" not in (root/"launcher.html").read_text(encoding="utf-8")
          assert not missing, "Missing local runtime dependencies: " + "; ".join(sorted(missing))
          print(f"Verified {checked} local file references, all service-worker assets, health/build identity and QA-report removal")
          PY
      - name: Run complete Node regression suite
        run: node --test tests/*.test.js

  browser-smoke:
    name: Chromium desktop and mobile interaction smoke
    needs: runtime-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local candidate server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/nu-candidate-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/pixel-art-studio.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nu-candidate-http.log
          exit 1
      - name: Verify Studio browser interactions
        run: python tests/nu-studio-browser-smoke.py --base-url http://127.0.0.1:8765 --browser chromium --require-mix
