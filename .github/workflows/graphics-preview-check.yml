name: N.U graphics preview smoke checks

on:
  push:
    branches:
      - feature/image-first-celestial-scene-2026-11-12
  pull_request:
    branches:
      - "Official-public-information-and-discovery-hub-for-N.U-(Niroo-Universe),-its-publishing-network,-projects,-publications-and-related-creative-works"

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          for file in nu-engine.js nu-pixel-world.js nu-graphics-core.js nu-background-engine.js nu-dynamic-layers.js nu-game-render-adapter.js nu-graphics-runtime.js nu-games.js; do
            node --check "$file"
          done
      - name: Validate manifest JSON
        run: python -m json.tool NU-GENERATION-1-MANIFEST.json >/dev/null
      - name: Verify archived source artwork is reachable
        run: curl -fsS -o /dev/null "https://raw.githubusercontent.com/niroouniverse-creator/NU-INGEST-ARCHIVE/main/ASSETS/NU-Celestial-City/Original%20reference%20image%20file%20for%20Niroo%20Universe%20%28N.U%29.png" >/dev/null
      - name: Verify local script references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          scripts = re.findall(r'<script src="./([^"]+)"', html)
          missing = [name for name in scripts if not Path(name).is_file()]
          if missing:
              raise SystemExit("Missing script files: " + ", ".join(missing))
          print(f"Validated {len(scripts)} local script references")
          PY
