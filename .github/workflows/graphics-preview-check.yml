name: N.U graphics preview smoke checks

on:
  push:
    branches:
      - feature/image-first-celestial-scene-2026-11-12
      - feature/gen1-pixel-art-studio-audit-2026-11-12
      - feature/gen1-adaptive-pixel-workspace-2026-11-12
      - feature/gen1-hp-wallet-profile-2026-11-12
      - feature/gen1-professional-svg-studio-2026-11-12
      - feature/gen1-human-test-demo-2026-11-12
      - feature/gen1-studio-viewport-input-repair-2026-11-12
      - Official-public-information-and-discovery-hub-for-N.U-(Niroo-Universe),-its-publishing-network,-projects,-publications-and-related-creative-works
  pull_request:
    branches:
      - "Official-public-information-and-discovery-hub-for-N.U-(Niroo-Universe),-its-publishing-network,-projects,-publications-and-related-creative-works"

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          for file in nu-engine.js nu-pixel-world.js nu-graphics-core.js nu-background-engine.js nu-dynamic-layers.js nu-game-render-adapter.js nu-graphics-runtime.js nu-games.js nu-svg-vectorizer.js nu-graphics-analysis.js nu-studio-layout.js nu-raster-import.js nu-pixel-art-studio.js nu-wallet.js nu-player-ui.js; do
            node --check "$file"
          done
      - name: Test wallet and HP capsule rules
        run: node --test tests/nu-wallet.test.js
      - name: Test SVG contour vectorizer
        run: node --test tests/nu-svg-vectorizer.test.js
      - name: Test graphics analysis and machine-readable IR
        run: node --test tests/nu-graphics-analysis.test.js
      - name: Test Studio viewport and pixel mapping
        run: node --test tests/nu-studio-layout.test.js
      - name: Test raster image palette matching
        run: node --test tests/nu-raster-import.test.js
      - name: Validate manifest JSON
        run: python -m json.tool NU-GENERATION-1-MANIFEST.json >/dev/null
      - name: Check public runtime artwork copy
        run: |
          if [ -s assets/nu-celestial-city.png ]; then
            file assets/nu-celestial-city.png
          else
            echo "::warning::Canonical PNG is in the private archive; upload it to assets/nu-celestial-city.png to activate the image-first public background."
          fi
      - name: Verify local script references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = ["index.html", "pixel-art-studio.html"]
          scripts = []
          for page in pages:
              html = Path(page).read_text()
              scripts.extend(re.findall(r'<script src="./([^"]+)"', html))
          missing = [name for name in scripts if not Path(name).is_file()]
          if missing:
              raise SystemExit("Missing script files: " + ", ".join(missing))
          print(f"Validated {len(scripts)} local script references across {len(pages)} pages")
          PY
